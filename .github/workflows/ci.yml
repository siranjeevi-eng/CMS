name: CI

on:
  push:
    branches:
      - main
      - typescript-migration

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install backend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint